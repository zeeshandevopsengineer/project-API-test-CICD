name: CI Pipeline with Inputs

on:
  workflow_dispatch:
    inputs:
      message:
        description: '📝 Write today message'
        required: true
        default: 'Hello from Pipeline!'
        type: string
      color:
        description: '🎨 Choose color'
        required: true
        default: 'Green'
        type: choice
        options:
          - Green
          - Red
          - Blue
          - Purple

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        pytest -v
    
    - name: Start API server with user inputs
      run: |
        # Pass inputs as environment variables
        export CI=true
        export USER_MESSAGE="${{ github.event.inputs.message }}"
        export USER_COLOR="${{ github.event.inputs.color }}"
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Test API endpoints
      run: |
        echo "=== Testing API Endpoints ==="
        echo "🔍 Testing /health..."
        curl -f http://localhost:8000/health || exit 1
        echo "🔍 Testing /..."
        curl -f http://localhost:8000/ || exit 1
        echo "🔍 Testing /learn..."
        curl -f http://localhost:8000/learn || exit 1
        echo "🔍 Testing /time..."
        curl -f http://localhost:8000/time || exit 1
        echo "✅ All API tests passed!"
    
    - name: Build Docker image
      run: |
        docker build -t taskflow-api:latest .
    
    - name: Test Docker container
      run: |
        docker run -d -p 8001:8000 --name test-api taskflow-api:latest
        sleep 10
        curl -f http://localhost:8001/health || exit 1
        docker stop test-api
        docker rm test-api
    
    - name: Save Docker image as artifact
      run: |
        docker save taskflow-api:latest > taskflow-api.tar
    
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: taskflow-api-image
        path: taskflow-api.tar
