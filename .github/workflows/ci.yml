name: CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      message:
        description: '📝 Write today message'
        required: true
        default: 'Hello from Pipeline!'
      color:
        description: '🎨 Choose color'
        required: true
        default: 'Green'

jobs:
  test:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python virtual environment
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -v
    
    - name: Start API with your inputs
      run: |
        source .venv/bin/activate
        export USER_MESSAGE="${{ github.event.inputs.message }}"
        export USER_COLOR="${{ github.event.inputs.color }}"
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Test API endpoints
      run: |
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8000/ || exit 1
        curl -f http://localhost:8000/learn || exit 1
        curl -f http://localhost:8000/time || exit 1
        echo "✅ All API tests passed!"
    
    - name: Build Docker image
      run: |
        docker build -t taskflow-api:latest .
    
    - name: Test Docker container
      run: |
        docker run -d -p 8001:8000 --name test-api taskflow-api:latest
        sleep 10
        curl -f http://localhost:8001/health || exit 1
        docker stop test-api
        docker rm test-api
    
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: taskflow-api-image
        path: taskflow-api.tar
