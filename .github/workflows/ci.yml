name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        pytest -v
    
    - name: Start API server with default input
      run: |
        # Set environment variable for pipeline mode
        export CI=true
        # Start the server in background
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Test API endpoints
      run: |
        echo "=== Testing API Endpoints ==="
        
        echo "🔍 Testing /health..."
        curl -f http://localhost:8000/health || exit 1
        
        echo "🔍 Testing /..."
        curl -f http://localhost:8000/ || exit 1
        
        echo "🔍 Testing /learn..."
        curl -f http://localhost:8000/learn || exit 1
        
        echo "🔍 Testing /time..."
        curl -f http://localhost:8000/time || exit 1
        
        echo "✅ All API tests passed!"
    
    - name: Build Docker image
      run: |
        docker build -t taskflow-api:latest .
    
    - name: Test Docker container
      run: |
        docker run -d -p 8000:8000 --name test-api taskflow-api:latest
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop test-api
        docker rm test-api
    
    - name: Save Docker image as artifact
      run: |
        docker save taskflow-api:latest > taskflow-api.tar
    
    - name: Upload Docker image
      uses: actions/upload-artifact@v3
      with:
        name: taskflow-api-image
        path: taskflow-api.tar
