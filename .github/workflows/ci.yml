name: CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      message:
        description: '📝 Write today message'
        required: true
        default: 'Hello from Pipeline!'
        type: string
      color:
        description: '🎨 Choose color'
        required: true
        default: 'Green'
        type: choice
        options:
          - Green
          - Red
          - Blue
          - Purple

jobs:
  test:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python virtual environment
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -v
    
    - name: Start API with your inputs (Keep Running)
      run: |
        source .venv/bin/activate
        export USER_MESSAGE="${{ github.event.inputs.message }}"
        export USER_COLOR="${{ github.event.inputs.color }}"
        echo "========================================="
        echo "📝 Your Message: ${{ github.event.inputs.message }}"
        echo "🎨 Your Color: ${{ github.event.inputs.color }}"
        echo "========================================="
        nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        echo "✅ API Server running on port 8000"
        echo "🌐 Web page: http://localhost:8000/web"
        echo "✏️ Form: http://localhost:8000/form"
    
    - name: Test API endpoints
      run: |
        echo "=== Testing API Endpoints ==="
        echo "🔍 Testing /health..."
        curl -f http://localhost:8000/health || exit 1
        echo "🔍 Testing /..."
        curl -f http://localhost:8000/ || exit 1
        echo "🔍 Testing /learn..."
        curl -f http://localhost:8000/learn || exit 1
        echo "🔍 Testing /time..."
        curl -f http://localhost:8000/time || exit 1
        echo "✅ All API tests passed!"
    
    - name: Build Docker image
      run: |
        docker build -t taskflow-api:latest .
    
    - name: Test Docker container
      run: |
        docker run -d -p 8001:8000 --name test-api taskflow-api:latest
        sleep 10
        curl -f http://localhost:8001/health || exit 1
        docker stop test-api
        docker rm test-api
    
    - name: Keep server alive
      run: |
        echo "========================================="
        echo "✅ API Server is RUNNING!"
        echo "🌐 Open: http://localhost:8000/web"
        echo "✏️ Customize: http://localhost:8000/form"
        echo "📝 Message: ${{ github.event.inputs.message }}"
        echo "🎨 Color: ${{ github.event.inputs.color }}"
        echo "========================================="
        echo "🟢 Server will continue running..."
        echo "🛑 To stop: pkill -f uvicorn"
        # Keep job alive to keep server running
        tail -f /dev/null
